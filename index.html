<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4F0">
<title>MEDIXA · Rumah Sakit Mini</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%96%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#F6F4F0;--card:#fff;--ink:#1E2A2D;--mut:#6E7A7C;--line:#E5E1DA;--pink:#C98E7E;--pink2:#F2E7E2;--mint:#8FB6A6;--mint2:#E7EFEA;--lav:#94A5BE;--lav2:#E9ECF2;--but:#DFC38F;--but2:#F6EFE1;--red:#A8534A;--red2:#F1E3E0;--ok:#47735D;--r:20px;--f1:'Fraunces','Iowan Old Style',Georgia,serif;--f2:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f2);color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 8% 0,#EDE5E0 0,transparent 42%),radial-gradient(circle at 100% 12%,#E6EDE8 0,transparent 38%);min-height:100vh;font-size:15px;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f1);font-weight:600;line-height:1.18;letter-spacing:-.015em}
h2.ttl{font-size:26px;margin:14px 0 4px}
h3{font-size:18px;margin-bottom:8px}
h3.sec{margin:22px 0 4px;font-size:17px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.mut{color:var(--mut)}.sm{font-size:13px}.tiny{font-size:12px;color:var(--mut)}
.center{text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:999px;font-weight:800;background:var(--lav);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;font-size:15px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink)}.btn.mint{background:var(--mint)}.btn.but{background:var(--but)}.btn.ghost{background:#fff}.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:6px 14px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.btn.block{width:100%;margin-top:6px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* cards */
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 4px 0 rgba(30,42,45,.10)}
.card.pink{background:var(--pink2)}.card.mint{background:var(--mint2)}.card.lav{background:var(--lav2)}.card.but{background:var(--but2)}.card.red{background:var(--red2)}
.card.clickable{cursor:pointer}
.card h3{display:flex;align-items:center;gap:6px}

/* form */
.form{display:block}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field>label{font-weight:800;font-size:13px}
.field label small{font-weight:600;color:var(--mut);margin-left:6px}
input,select,textarea{width:100%;padding:10px 13px;border:2px solid var(--ink);border-radius:14px;background:#fff}
input[type=range]{padding:0;accent-color:var(--pink);border:0;height:28px}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hint{font-size:12px;color:var(--mut);margin-top:-6px;margin-bottom:10px;min-height:16px}
.seg{display:flex;gap:8px}
.seg label{flex:1}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:10px;border:2px solid var(--ink);border-radius:14px;background:#fff;font-weight:700;cursor:pointer}
.seg input:checked+span{background:var(--pink2);box-shadow:0 3px 0 var(--ink)}
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff;cursor:pointer;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--pink);flex:none}
.chk:has(input:checked){border-color:var(--ink);background:var(--mint2)}
fieldset{border:2px dashed var(--line);border-radius:16px;padding:12px 12px 2px;margin-bottom:12px;min-width:0}
legend{font-family:var(--f1);font-weight:600;padding:0 8px}

/* badge / pill */
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;border:2px solid var(--ink);white-space:nowrap}
.badge.lav{background:var(--lav2)}.badge.butter{background:var(--but)}.badge.mint{background:var(--mint)}.badge.ok{background:#CFE3D7}.badge.pink{background:var(--pink2)}.badge.red{background:var(--red);color:#fff}
.pill{display:inline-block;padding:6px 12px;border-radius:12px;font-weight:700;font-size:13px}
.pill.lav{background:var(--lav2)}.pill.mint{background:var(--mint2)}.pill.but{background:var(--but2)}.pill.red{background:var(--red2)}

/* mascot */
.dixa{width:96px;height:96px;flex:none}
.dixa.sm{width:44px;height:44px}.dixa.md{width:72px;height:72px}.dixa.big{width:150px;height:150px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@media(prefers-reduced-motion:reduce){.dixa.big{animation:none}*{transition:none!important}}

/* landing + login */
.landing,.loginw{max-width:560px;margin:0 auto;padding:52px 18px 60px;text-align:center}
.logo{font-family:var(--f1);font-weight:600;font-size:clamp(30px,8.5vw,46px);letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
.logo em{font-style:normal;font-weight:400;color:var(--mut)}
.landing .rule{width:52px;height:2px;background:var(--pink);margin:16px auto 22px;border-radius:2px}
.tagline{color:var(--mut);margin:4px 0 26px}
.roles{display:grid;gap:14px;margin-top:14px}
.role{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.role:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.role.pink{background:var(--pink)}.role.mint{background:var(--mint)}
.role .em{font-size:38px}
.role b{font-family:var(--f1);font-size:20px;display:block}
.role span.d{font-size:13px;font-weight:600}
.loginw .card{text-align:left}
.loginw .rule{width:44px;height:2px;background:var(--pink);margin:14px auto 18px;border-radius:2px}
.tabsw{display:flex;gap:8px;margin-bottom:14px}
.tabsw button{flex:1;padding:9px;border-radius:14px;border:2px solid var(--ink);background:#fff;font-weight:800}
.tabsw button.on{background:var(--but)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:5px 12px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:13px}

/* shell */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;position:sticky;top:0;z-index:5;background:rgba(246,244,240,.92);backdrop-filter:blur(8px);padding-top:calc(10px + env(safe-area-inset-top))}
.brand-mini{display:flex;align-items:center;gap:8px;font-family:var(--f1);font-weight:700;font-size:21px;letter-spacing:0}
.top .hi{font-size:13px;color:var(--mut);font-weight:700}
.content{padding:4px 16px 110px;max-width:980px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:2px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10;gap:4px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;font-weight:800;color:var(--mut);padding:5px 0;border-radius:14px}
.tabbar button.on{color:var(--ink);background:var(--pink2)}
.tabbar .ic{font-size:20px}
@media(min-width:860px){
 .side{display:flex;flex-direction:column;width:250px;padding:20px 14px;border-right:2px solid var(--ink);background:#fff;position:sticky;top:0;height:100vh}
 .logo-s{display:flex;align-items:center;gap:8px;font-family:var(--f1);font-weight:700;font-size:25px;letter-spacing:0;margin-bottom:22px}
 .sidenav{display:flex;flex-direction:column;gap:6px;flex:1}
 .navb{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;font-weight:800;text-align:left}
 .navb.on{background:var(--pink2);box-shadow:inset 0 0 0 2px var(--ink)}
 .who{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;background:var(--lav2)}
 .tabbar,.brand-mini,.top .btn{display:none}
 .content{padding:8px 28px 40px}
}

/* hello / kartu */
.hello{display:flex;align-items:center;gap:12px;margin-top:6px}
.hello h2{font-size:24px}
.kartu{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--pink) 0,var(--lav) 100%);border:2.5px solid var(--ink);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 5px 0 var(--ink)}
.kartu small{font-weight:800;opacity:.75}
.kartu .nm{font-family:var(--f1);font-size:22px;margin:2px 0 8px}
.kartu .mrn{font-family:var(--f1);font-size:28px;letter-spacing:2px}
.kartu .mini{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:700}
.kartu::after{content:"✚";position:absolute;right:-8px;top:-18px;font-size:110px;color:rgba(255,255,255,.28);font-family:var(--f1)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border:2px solid var(--ink);border-radius:18px;font-weight:800;font-size:13px;background:#fff;box-shadow:0 4px 0 rgba(30,42,45,.10)}
.tile .em{font-size:28px}
.tile:nth-child(1){background:var(--mint2)}.tile:nth-child(2){background:var(--but2)}.tile:nth-child(3){background:var(--lav2)}
.tip{background:var(--but2);border:2px dashed var(--ink);border-radius:18px;padding:12px 14px;margin:14px 0;font-weight:700}
.empty{text-align:center;padding:22px 16px}
.empty .dixa{margin:0 auto 6px}
.empty h3{justify-content:center}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border:2px solid var(--ink);border-radius:18px;padding:12px;background:#fff}
.stat b{font-family:var(--f1);font-size:30px;display:block;line-height:1}
.stat span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.stat:nth-child(1){background:var(--lav2)}.stat:nth-child(2){background:var(--mint2)}.stat:nth-child(3){background:var(--pink2)}.stat:nth-child(4){background:var(--but2)}

/* visit card */
.visit{display:flex;gap:12px}
.vic{font-size:32px;width:52px;height:52px;flex:none;display:grid;place-items:center;background:var(--lav2);border-radius:16px;border:2px solid var(--ink)}
.vbody{flex:1;min-width:0}
.vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.poli-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.poli{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:2px solid var(--ink);border-radius:16px;background:#fff;font-weight:800;font-size:12px}
.poli span{font-size:26px}
.poli.on{background:var(--but);box-shadow:0 3px 0 var(--ink)}
.ticket{text-align:center;background:var(--but2);border:2.5px dashed var(--ink);border-radius:22px;padding:18px;margin:12px 0}
.ticket .no{font-family:var(--f1);font-size:54px;font-weight:700;letter-spacing:2px;color:var(--pink);text-shadow:2px 2px 0 var(--ink)}

/* detail */
.pat-head{display:flex;gap:12px;align-items:flex-start}
.av{font-size:34px;width:54px;height:54px;border-radius:18px;background:var(--pink2);border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.alergi{background:var(--red2);border:2px solid var(--red);border-radius:14px;padding:8px 12px;font-weight:800;color:#8E4238;margin-top:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:13px}
.tabs button.on{background:var(--pink);box-shadow:0 3px 0 var(--ink)}
.scroll-x{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:380px}
.tbl th{font-family:var(--f2);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px 4px;text-align:center}
.tbl td{padding:8px 4px;text-align:center;border-top:1.5px dashed var(--line);font-weight:700}
.tbl td.w{background:var(--red2);color:#8E4238;font-weight:800}
.tbl td:first-child{text-align:left;font-size:12px;color:var(--mut)}
.sparks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spark{width:100%;height:auto;display:block}
.sparks .stat{padding:10px}
.calc{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.face{font-size:34px;text-align:center}
.pes{border-left:6px solid var(--lav);padding:4px 0 4px 12px;margin:10px 0}
.pes b{font-family:var(--f1)}
.pes ul{margin:4px 0 0 18px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--mut);font-weight:700}.kv dd{margin:0;font-weight:700;word-break:break-word}
.soap p{margin:3px 0}
.soap b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:8px;background:var(--lav);border:2px solid var(--ink);font-size:12px;margin-right:6px}
.soap p:nth-child(2) b{background:var(--mint)}.soap p:nth-child(3) b{background:var(--but)}.soap p:nth-child(4) b{background:var(--pink)}
.mar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1.5px dashed var(--line)}
.mar:first-of-type{border-top:0}
.bar{height:14px;background:var(--lav2);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint)}
.bal{font-family:var(--f1);font-size:26px}
.sbar p{margin:0 0 8px}
.sbar b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:9px;background:var(--pink);border:2px solid var(--ink);margin-right:8px;font-family:var(--f1)}

/* beds + patients */
.beds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.beds{grid-template-columns:repeat(4,1fr)}}
.bed{display:flex;flex-direction:column;gap:2px;text-align:left;border:2px dashed var(--mut);border-radius:18px;padding:12px;min-height:118px;background:#fff}
.bed.occ{border:2px solid var(--ink);background:var(--mint2)}
.bed.alert{background:var(--red2)}
.bed .bn{font-family:var(--f2);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.bed .pn{font-weight:800;line-height:1.2}
.plist .row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1.5px dashed var(--line);width:100%;text-align:left}
.plist .row:first-child{border-top:0}
.search{margin:10px 0}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.on{display:block}
.ov{position:absolute;inset:0;background:rgba(30,42,45,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border:2.5px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom))}
.sheet .x{position:absolute;right:12px;top:12px}
.sheet h3{padding-right:60px;font-size:20px}
@media(min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:580px;border-radius:26px;border-bottom:2.5px solid var(--ink);max-height:86vh}}
pre.json{background:var(--ink);color:#DCE3E2;padding:14px;border-radius:16px;overflow:auto;font-size:12px;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:10px 0;max-height:52vh}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:99;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:26px;text-align:center}
.foot button{text-decoration:underline;color:var(--mut);font-size:12px}

</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <symbol id="dixa" viewBox="0 0 120 120">

  <path d="M60 32c-26 0-42 17-42 41 0 21 16 37 42 37s42-16 42-37c0-24-16-41-42-41z" fill="#8FB6A6" stroke="#1E2A2D" stroke-width="3"/>
  <path d="M33 40c2-15 14-24 27-24s25 9 27 24c-8-5-17-7-27-7s-19 2-27 7z" fill="#fff" stroke="#1E2A2D" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 19v14M53 26h14" stroke="#C07F6C" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="46" cy="68" rx="4.5" ry="6" fill="#1E2A2D"/><ellipse cx="74" cy="68" rx="4.5" ry="6" fill="#1E2A2D"/>
  <circle cx="47.6" cy="65.5" r="1.7" fill="#fff"/><circle cx="75.6" cy="65.5" r="1.7" fill="#fff"/>
  <ellipse cx="36" cy="80" rx="6" ry="4" fill="#C98E7E" opacity=".75"/><ellipse cx="84" cy="80" rx="6" ry="4" fill="#C98E7E" opacity=".75"/>

 </symbol>

<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
   MEDIXA — rumah sakit mini (demo). Data fiktif, tersimpan di
   localStorage browser. Struktur data mengikuti FHIR/SATUSEHAT
   tapi BELUM terhubung ke SATUSEHAT.
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoDate=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm=(d=new Date())=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const stamp=()=>`${isoDate()}T${hhmm()}`;
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoDate(d)};
const T=(d,h)=>addDays(d)+'T'+h;
const parseD=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=s=>s?parseD(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const fmtDT=t=>t?`${fmtD(t)}, ${t.slice(11,16)}`:'-';
const age=dob=>{const b=parseD(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const daysBetween=(a,b)=>{const x=parseD(a),y=parseD(b);return Math.round((Date.UTC(y.getFullYear(),y.getMonth(),y.getDate())-Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/864e5)};
const uid=()=>Math.random().toString(36).slice(2,9);
const maskNik=n=>n.slice(0,4)+'••••••••'+n.slice(-4);

const NURSE='Ns. Sari Dewanti, S.Kep', NURSE_S='Ns. Sari';

function nHome(){

 const ris=S.encounters.filter(e=>e.cls==='IMP'&&e.status==='in-progress');

}

function spark(vals,color){
 if(vals.length<2)return '';
 const w=220,h=56,p=7,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
 const pts=vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1),h-p-(v-mn)/r*(h-2*p)]);
 return `<svg viewBox="0 0 ${w} ${h}" class="spark"><polyline points="${pts.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2.5"/>`).join('')}</svg><b style="font-family:var(--f1)">${vals[vals.length-1]}</b>`;
}

/* ---------- live calculators ---------- */
function calcKaji(f){
 const g=n=>f.elements[n];
 const b=bmiInfo(+g('bb').value,+g('tb').value);
 $('#bmi').textContent=b?`IMT ${b.v} · ${b.l}`:'IMT: isi BB & TB dulu';
 const n=+g('nyeri').value;$('#face').textContent=FACES[n];$('#nyeriL').textContent=`${n}/10 · ${nyeriLabel(n)}`;
 const gt=(+g('g_e').value)+(+g('g_m').value)+(+g('g_v').value);$('#gcsL').textContent=`GCS ${gt} · ${gcsLabel(gt)}`;
 const mt=MORSE.reduce((a,[k])=>a+(+g('m_'+k).value),0),ml=morseLabel(mt);
 const el=$('#morseL');el.textContent=`Skor ${mt} · ${ml[0]}`;el.className='pill '+(ml[1]==='red'?'red':ml[1]==='but'?'but':'mint');
}
const L={
 reg(el,f){
  if(el.name==='nik'){el.value=el.value.replace(/\D/g,'').slice(0,16)}
  const nik=f.elements.nik.value;$('#nikc').textContent=nik.length+'/16';
  const lahir=f.elements.lahir.value,h=$('#nikhint');
  if(nik.length===16&&lahir){
   const [y,m,d]=lahir.split('-'),dd=String(+d+(f.elements.jk.value==='P'?40:0)).padStart(2,'0'),exp=dd+m+y.slice(2);
   h.textContent=nik.slice(6,12)===exp?'✅ NIK cocok dengan tanggal lahir & jenis kelamin':`⚠️ Digit ke-7 sampai 12 NIK biasanya ${exp} (tgl lahir, +40 untuk perempuan). Cek lagi ya, tapi tetap bisa disimpan.`;
  }else h.textContent='';
 },
 kaji(el,f){calcKaji(f)},
 askep(el,f){
  if(el.name!=='sdki')return;
  const d=SDKI.find(x=>x.k===el.value);
  $('#askepDyn').innerHTML=askepDyn(d);
  $('#gejalaL').innerHTML=d&&d.risk?'Faktor risiko <small>(dibuktikan dengan)</small>':'Tanda & gejala <small>(dibuktikan dengan)</small>';
  f.elements.gejala.required=!!d&&!d.risk;
 },
 search(el){$('#plist').innerHTML=patList(el.value)}
};

 visit(t){
  const e=enc(t.dataset.id),po=POLI.find(x=>x.id===e.poli)||{nama:''},[l]=stBadge(e),x=lastTTV(e),k=e.pengkajian;
  openModal(`<h3>${e.cls==='IMP'?'🛏️ Rawat Inap':'🩺 Rawat Jalan'} · ${esc(po.nama)}</h3>
   <dl class="kv"><dt>Status</dt><dd>${l}</dd><dt>Tanggal</dt><dd>${fmtD(e.tanggal)}, ${e.jam}</dd><dt>Dokter</dt><dd>${esc(e.dokter)}</dd>${e.antrean?`<dt>No. antrean</dt><dd>${e.antrean}</dd>`:''}${e.bed?`<dt>Bed</dt><dd>${e.bed}</dd>`:''}<dt>Keluhan</dt><dd>${esc(e.keluhan)}</dd>
   ${x?`<dt>TTV terakhir</dt><dd>TD ${x.sis}/${x.dia}, N ${x.nadi}, RR ${x.rr}, S ${x.suhu}°C, SpO₂ ${x.spo2}%</dd>`:''}${k&&k.nyeri!=null?`<dt>Skala nyeri</dt><dd>${k.nyeri}/10</dd>`:''}</dl>
   <button class="btn but sm" data-act="fhirE" data-id="${e.id}" style="margin-top:14px">Format FHIR</button>`);
 },
 cancelVisit(t){const id=t.dataset.id;askConfirm('Batalkan kunjungan ini?',()=>{enc(id).status='cancelled';save();render();toast('Kunjungan dibatalkan')})},

 /* perawat: antrean */
 checkin(t){enc(t.dataset.id).status='arrived';save();render();toast('Pasien sudah check-in ✔️')},
 startKaji(t){const e=enc(t.dataset.id);e.status='in-progress';UI.enc=e.id;UI.encTab='ttv';save();render();toTop();toast('Yuk mulai pengkajian 📝')},
 openEnc(t){UI.enc=t.dataset.id;UI.encTab='ttv';render();toTop()},
 closeEnc(){UI.enc=null;render();toTop()},
 encTab(t){UI.encTab=t.dataset.tab;render()},
 finishAmb(t){enc(t.dataset.id).status='finished';UI.enc=null;save();render();toTop();toast('Kunjungan selesai. Kerja bagus! 🎉')},
 newVisit(){
  openModal(`<h3>Kunjungan baru</h3><div class="field"><label>Pasien</label><select id="nvPat">${S.patients.map(p=>`<option value="${p.id}">${esc(p.nama)} · RM ${p.mrn}</option>`).join('')}</select></div><div id="nvForm">${visitForm(S.patients[0].id)}</div>`);
  $('#nvPat').addEventListener('change',ev=>{$('#nvForm').innerHTML=visitForm(ev.target.value)});
 },

 /* perawat: rawat inap */
 admitForm(t){
  const free=S.patients.filter(p=>!activeIMP(p.id));
  openModal(`<h3>Terima pasien di bed ${t.dataset.bed} 🛏️</h3><form class="form" data-submit="admit" data-bed="${t.dataset.bed}">
   <div class="field"><label>Pasien</label><select name="pid" required>${free.map(p=>`<option value="${p.id}">${esc(p.nama)} · RM ${p.mrn}</option>`).join('')}</select></div>
   <div class="field"><label>DPJP</label><select name="dokter">${ALLDOC.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div>
   <div class="field"><label>Diagnosis / keluhan masuk</label><textarea name="keluhan" rows="2" required></textarea></div>
   <button class="btn mint block">Terima pasien</button></form>`);
 },

 /* perawat: pasien */
 newPatient(){openModal(`<h3>Registrasi pasien baru 🧸</h3>${regForm('nurse')}`)},
 patDetail(t){
  const p=pat(t.dataset.id),es=encsOf(p.id).sort(byNewest);
  openModal(`<div class="pat-head"><div class="av">${p.jk==='L'?'👦':'👧'}</div><div><h3 style="margin:0;padding:0">${esc(p.nama)}</h3><div class="mut sm">RM ${p.mrn} · ${age(p.lahir)} th · ${esc(p.penjamin)}</div></div></div>
  <dl class="kv" style="margin-top:12px"><dt>NIK</dt><dd>${p.nik}</dd><dt>Lahir</dt><dd>${esc(p.tempat)}, ${fmtD(p.lahir)}</dd><dt>No. HP</dt><dd>${esc(p.hp)}</dd><dt>Alamat</dt><dd>${esc(p.alamat)}, ${esc(p.kel)}, ${esc(p.kec)}, ${esc(p.kota)}</dd><dt>Kontak darurat</dt><dd>${esc(p.kontak.nama)} (${esc(p.kontak.hub)}) · ${esc(p.kontak.hp)}</dd></dl>
  <h3 class="sec">Kunjungan</h3>${es.length?es.map(e=>`<div class="mar"><div><b>${e.cls==='IMP'?'🛏️ Rawat inap':'🩺 Rawat jalan'}</b><div class="sm mut">${fmtD(e.tanggal)} · ${esc(e.keluhan.slice(0,40))}</div></div><span class="badge ${stBadge(e)[1]}">${stBadge(e)[0]}</span></div>`).join(''):'<p class="mut sm">Belum ada kunjungan.</p>'}
  <div class="acts"><button class="btn pink sm" data-act="visitFor" data-id="${p.id}">Buat kunjungan RJ</button><button class="btn but sm" data-act="fhirP" data-id="${p.id}">Format FHIR</button></div>`);
 },
 visitFor(t){openModal(`<h3>Kunjungan rawat jalan</h3><p class="mut sm">${esc(pat(t.dataset.id).nama)}</p>${visitForm(t.dataset.id)}`)},

 /* detail: askep, obat, dll */
 delAskep(t){const e=enc(UI.enc);e.askep=e.askep.filter(a=>a.id!==t.dataset.id);save();render()},
 fillO(){
  const e=enc(UI.enc),x=lastTTV(e);if(!x)return toast('Belum ada TTV untuk diambil');
  $('#cpptO').value=`TD ${x.sis}/${x.dia} mmHg, N ${x.nadi}x/menit, RR ${x.rr}x/menit, S ${x.suhu}°C, SpO₂ ${x.spo2}%`;
 },
 giveMed(t){
  const e=enc(UI.enc),m=e.mar.find(x=>x.id===t.dataset.id);
  openModal(`<h3>6 Benar dulu yuk! 💊</h3><p><b>${esc(m.obat)}</b> ${esc(m.dosis)} · ${esc(m.rute)} · jam ${m.jam}</p>${alergiBanner(e)}
   <form class="form" data-submit="giveConfirm" data-id="${m.id}" style="margin-top:10px">
   ${['Benar pasien','Benar obat','Benar dosis','Benar rute','Benar waktu','Benar dokumentasi'].map(x=>`<label class="chk"><input type="checkbox" required><span>${x}</span></label>`).join('')}
   <button class="btn mint block">Sudah diberikan ✅</button></form>`);
 },
 toggleDis(t){const e=enc(UI.enc);e.discharge=e.discharge||{};e.discharge[t.dataset.i]=t.checked;save();render()},
 copySbar(){copyText(LAST_SBAR,'SBAR tersalin 📋')},
 pulangkan(){
  askConfirm('Pulangkan pasien ini?',()=>{const e=enc(UI.enc);e.status='finished';e.dischargeAt=stamp();UI.enc=null;save();render();toTop();toast('Pasien pulang, bed kosong lagi 🎈')});
 }
};

/* =========================================================
   SUBMIT handlers
   ========================================================= */
const F={
 loginPatient(f){
  const d=Object.fromEntries(new FormData(f)),p=S.patients.find(x=>x.nik===d.nik&&x.pin===d.pin);
  if(!p)return toast('NIK atau PIN belum cocok 🥺');
  S.session={role:'patient',pid:p.id};UI.tab='home';save();render();toTop();toast(`Halo ${p.nama.split(' ')[0]}! 💖`);
 },
 loginNurse(f){
  const d=Object.fromEntries(new FormData(f));
  if(d.u.trim().toLowerCase()!=='perawat'||d.p!=='medixa123')return toast('Username atau password belum cocok 🥺');
  S.session={role:'nurse'};UI.tab='home';UI.enc=null;save();render();toTop();toast(`Halo ${NURSE_S}! 💉`);
 },
 register(f){
  const d=Object.fromEntries(new FormData(f)),self=f.dataset.mode==='self';
  if(!/^\d{16}$/.test(d.nik))return toast('NIK harus 16 digit angka ya 🥺');
  if(S.patients.some(p=>p.nik===d.nik))return toast('NIK ini sudah terdaftar 👀');
  if(self&&!/^\d{6}$/.test(d.pin||''))return toast('PIN harus 6 digit angka');
  const mrn=String(Math.max(0,...S.patients.map(p=>+p.mrn))+1).padStart(6,'0');
  const p={id:'p'+uid(),mrn,nik:d.nik,nama:d.nama.trim(),jk:d.jk,tempat:d.tempat.trim(),lahir:d.lahir,marital:d.marital,hp:d.hp,alamat:d.alamat.trim(),rtrw:d.rtrw||'',kel:d.kel,kec:d.kec,kota:d.kota,prov:d.prov,pos:d.pos||'',kerja:(d.kerja||'').trim(),penjamin:d.penjamin,kontak:{nama:d.k_nama,hub:d.k_hub,hp:d.k_hp},pin:self?d.pin:'123456'};
  S.patients.push(p);
  if(self){S.session={role:'patient',pid:p.id};UI.tab='home'}
  save();render();
  openModal(`<div class="center">${dixa('md')}<h3 style="padding:0">Registrasi berhasil! 🎉</h3><div class="ticket"><div class="tiny">NOMOR REKAM MEDIS</div><div class="no">${p.mrn}</div><div class="sm">${esc(p.nama)}</div></div><p class="sm mut">Nomor SATUSEHAT (IHS) akan diisi setelah MEDIXA terhubung ke SATUSEHAT.</p><button class="btn pink block" data-act="closeModal">Siap!</button></div>`);
 },
 rjSubmit(f){
  const d=Object.fromEntries(new FormData(f));
  if(!d.poli)return toast('Pilih poli dulu ya 🩺');
  const po=POLI.find(x=>x.id===d.poli),n=S.encounters.filter(e=>e.cls==='AMB'&&e.poli===po.id&&e.tanggal===d.tanggal).length+1;
  const e=newEnc({patientId:f.dataset.pid,cls:'AMB',poli:po.id,dokter:d.dokter,tanggal:d.tanggal,jam:d.jam,keluhan:d.keluhan.trim(),status:'planned',antrean:`${po.kode}-${String(n).padStart(3,'0')}`});
  S.encounters.push(e);save();render();
  openModal(`<div class="center"><h3 style="padding:0">Kunjungan terdaftar! 🎟️</h3><div class="ticket"><div class="tiny">NOMOR ANTREAN</div><div class="no">${e.antrean}</div><div class="sm">${po.icon} ${esc(po.nama)} · ${esc(e.dokter)}</div><div class="sm">📅 ${fmtD(e.tanggal)}, ${e.jam}</div></div><p class="sm mut">Datang 15 menit lebih awal dan lapor ke perawat untuk check-in.</p><button class="btn pink block" data-act="closeModal">Oke!</button></div>`);
 },
 saveTTV(f){
  const e=enc(UI.enc),d=Object.fromEntries(new FormData(f)),x={t:stamp(),by:NURSE_S};
  ['sis','dia','nadi','rr','suhu','spo2'].forEach(k=>x[k]=+d[k]);
  if(x.sis<=x.dia)return toast('Sistolik harus lebih besar dari diastolik ya');
  e.ttv.push(x);save();render();
  toast(ttvWarn(x)?'⚠️ Ada TTV di luar batas normal. Jangan lupa lapor DPJP ya!':'TTV tersimpan, semua normal 💓');
 },
 saveKaji(f){
  const e=enc(UI.enc),d=Object.fromEntries(new FormData(f));
  const morse={};MORSE.forEach(([k])=>morse[k]=+d['m_'+k]);
  e.pengkajian={t:stamp(),by:NURSE_S,bb:d.bb?+d.bb:'',tb:d.tb?+d.tb:'',alergi:(d.alergi||'').trim(),nyeri:+d.nyeri,lokasiNyeri:(d.lokasiNyeri||'').trim(),gcs:{e:+d.g_e,m:+d.g_m,v:+d.g_v},morse,catatan:(d.catatan||'').trim()};
  save();render();toast('Pengkajian tersimpan 💾');
 },
 addAskep(f){
  const e=enc(UI.enc),d=Object.fromEntries(new FormData(f)),dx=SDKI.find(x=>x.k===d.sdki);
  if(!dx)return toast('Pilih diagnosis dulu ya');
  const siki=$$('input[name=siki]:checked',f).map(i=>{const [k,n]=i.value.split('|');return{k,n}});
  if(!siki.length)return toast('Pilih minimal satu intervensi');
  e.askep.push({id:'a'+uid(),sdki:{k:dx.k,n:dx.n},risk:!!dx.risk,etiologi:d.etiologi.trim(),gejala:(d.gejala||'').trim(),slki:{k:dx.slki[0],n:dx.slki[1]},target:(d.target||'').trim(),siki,t:stamp(),by:NURSE_S});
  save();render();toast('Diagnosis tersimpan 🧩');
 },
 addCppt(f){
  const e=enc(UI.enc),d=Object.fromEntries(new FormData(f));
  if(!(d.s||d.o||d.a||d.p).trim())return toast('Isi minimal satu bagian SOAP ya');
  e.cppt.push({id:'c'+uid(),t:stamp(),by:NURSE_S,s:d.s.trim(),o:d.o.trim(),a:d.a.trim(),p:d.p.trim()});
  save();render();toast('CPPT tersimpan 🗒️');
 },
 addObat(f){
  const e=enc(UI.enc),d=Object.fromEntries(new FormData(f));
  e.mar.push({id:'m'+uid(),obat:d.obat.trim(),dosis:d.dosis.trim(),rute:d.rute,jam:d.jam,given:false});
  save();render();toast('Jadwal obat ditambahkan 💊');
 },
 giveConfirm(f){
  const e=enc(UI.enc),m=e.mar.find(x=>x.id===f.dataset.id);
  m.given=true;m.givenAt=stamp();m.by=NURSE_S;save();closeModal();render();toast('Obat tercatat diberikan ✅');
 },
 addIO(f){
  const e=enc(UI.enc),d=Object.fromEntries(new FormData(f));
  e.io.push({id:'i'+uid(),t:stamp(),type:d.type,label:d.label.trim(),ml:+d.ml});
  save();render();toast('Tercatat 💧');
 },
 admit(f){
  const d=Object.fromEntries(new FormData(f));
  if(bedOcc(f.dataset.bed))return toast('Bed ini sudah terisi');
  const e=newEnc({patientId:d.pid,cls:'IMP',poli:'dalam',dokter:d.dokter,tanggal:today(),jam:hhmm(),keluhan:d.keluhan.trim(),status:'in-progress',antrean:'',bed:f.dataset.bed,admitAt:stamp()});
  S.encounters.push(e);UI.enc=e.id;UI.encTab='kaji';save();closeModal();render();toTop();toast('Pasien diterima. Mulai dengan pengkajian ya 📝');
 }
};

/* =========================================================
   event wiring
   ========================================================= */
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-act]');if(!t)return;
 const fn=A[t.dataset.act];if(!fn)return;
 if(t.tagName==='BUTTON'||t.tagName==='DIV'||t.tagName==='INPUT'||t.tagName==='A')fn(t,ev);
});
const liveH=ev=>{const f=ev.target.closest('[data-live]');if(!f)return;const h=L[f.dataset.live];if(h)h(ev.target,f)};
document.addEventListener('input',liveH);
document.addEventListener('change',liveH);
document.addEventListener('submit',ev=>{
 const f=ev.target.closest('form[data-submit]');if(!f)return;
 ev.preventDefault();const h=F[f.dataset.submit];if(h)h(f);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});

/* mulai */
document.title='MEDIXA · Rumah Sakit Mini';
render();

</script>
